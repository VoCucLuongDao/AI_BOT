; PlatformIO Project Configuration for xiaozhi-esp32 (TienHuyIoT Vietnam fork)
; Converted from ESP-IDF to the PlatformIO ESP-IDF framework
; Target board : xiaozhi-ai-iot-vietnam-es3n28p-lcd-2.8
; Hardware     : ESP32-S3 N16R8 (16 MB flash + 8 MB octal PSRAM)
;
; Board/target options (PSRAM, flash size, partition table, board type, ...)
; are defined in sdkconfig.defaults.  If you change sdkconfig.defaults you must
; delete sdkconfig.esp32-s3-n16r8-idf so that ESP-IDF regenerates it.

[env:esp32-s3-n16r8-idf]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; Serial monitor / upload
monitor_speed = 115200
upload_speed = 921600
monitor_rts = 0
monitor_dtr = 0

; 16 MB flash (the devkitc-1 board definition defaults to 8 MB)
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; Partition table (must match CONFIG_PARTITION_TABLE_CUSTOM_FILENAME)
board_build.partitions = partitions/v2/16m.csv

; Only flags that are not covered by Kconfig.  Do NOT add fake CONFIG_* here:
; the real values come from sdkconfig.defaults / sdkconfig.<env>.
build_flags =
    -Wno-missing-field-initializers

; ---------------------------------------------------------------------------
; Embedded binary assets
; ---------------------------------------------------------------------------
; ESP-IDF turns every EMBED_FILES/EMBED_TXTFILES entry into an assembly stub
; (<build_dir>/<file name>.S) and PlatformIO compiles the sources of every
; component through SCons *before* ninja runs.  Those stubs therefore have to
; exist up-front, which is what board_build.embed_files / embed_txtfiles do.
; Keep these lists in sync with:
;   * src/CMakeLists.txt  (EMBED_FILES: locale sounds, common sounds, web pages)
;   * managed_components/TienHuyIoT_esp-wifi-connect/CMakeLists.txt
;     (EMBED_TXTFILES: wifi configuration pages)
; The locale files must match CONFIG_LANGUAGE_* in sdkconfig.defaults
; (currently vi-VN).
board_build.embed_files =
    src/assets/locales/vi-VN/0.ogg
    src/assets/locales/vi-VN/1.ogg
    src/assets/locales/vi-VN/2.ogg
    src/assets/locales/vi-VN/3.ogg
    src/assets/locales/vi-VN/4.ogg
    src/assets/locales/vi-VN/5.ogg
    src/assets/locales/vi-VN/6.ogg
    src/assets/locales/vi-VN/7.ogg
    src/assets/locales/vi-VN/8.ogg
    src/assets/locales/vi-VN/9.ogg
    src/assets/locales/vi-VN/activation.ogg
    src/assets/locales/vi-VN/err_pin.ogg
    src/assets/locales/vi-VN/err_reg.ogg
    src/assets/locales/vi-VN/upgrade.ogg
    src/assets/locales/vi-VN/welcome.ogg
    src/assets/locales/vi-VN/wificonfig.ogg
    src/assets/common/exclamation.ogg
    src/assets/common/low_battery.ogg
    src/assets/common/popup.ogg
    src/assets/common/success.ogg
    src/assets/common/vibration.ogg
    src/assets/web_browser/assets_index.html
    src/assets/web_browser/ota_index.html

board_build.embed_txtfiles =
    managed_components/TienHuyIoT_esp-wifi-connect/assets/wifi_configuration.html
    managed_components/TienHuyIoT_esp-wifi-connect/assets/wifi_configuration_done.html

; Generates src/assets/lang_config.h before the build
extra_scripts = pre:scripts/pre_build.py
